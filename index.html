<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냠냠 베이커리 🍞</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c0aff5d8d60d26dbd5c92e48b0aeac3f&libraries=services"></script>
    <style>
        :root {
            --point-pink: #FFC0CB; /* 연핑크 (베이커리) */
            --point-blue: #87CEEB; /* 하늘색 (내 위치) */
            --bg-cream: #FFF9F0;
        }

        * { font-family: 'Gaegu', cursive; box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: var(--bg-cream); }

        .container { display: flex; height: 100vh; }

        /* 왼쪽 사이드바 */
        #menu_wrap {
            width: 380px;
            height: 100%;
            background: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            border-right: 3px dashed var(--point-pink);
            position: relative;
        }

        /* 빵 일러스트 데코레이션 (왼쪽 상단 4종) */
        .bakery-deco {
            position: absolute;
            top: 5px;
            left: 5px;
            display: flex;
            gap: 5px;
            z-index: 20;
        }
        .bakery-deco span { font-size: 24px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1)); }

        h1 {
            color: #ff8fa3;
            text-align: center;
            font-size: 42px;
            margin-top: 15px;
            margin-bottom: 20px;
            text-shadow: 2px 2px #ffe4e8;
        }

        .search_box { margin-bottom: 20px; position: relative; }
        .search_box input {
            width: 100%;
            padding: 12px 15px;
            border: 3px solid var(--point-pink);
            border-radius: 20px;
            font-size: 20px;
            outline: none;
        }
        .search_box button {
            position: absolute;
            right: 5px;
            top: 5px;
            padding: 8px 15px;
            background: var(--point-pink);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 리스트 스타일 */
        #placesList { list-style: none; padding: 0; overflow-y: auto; flex: 1; }
        #placesList li {
            padding: 15px;
            margin-bottom: 10px;
            background: #fff5f7;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid transparent;
        }
        #placesList li:hover { 
            transform: scale(1.02); 
            border: 1px solid var(--point-pink);
        }
        #placesList li h5 { color: #d63384; font-size: 22px; margin: 0 0 5px 0; }
        #placesList li span { font-size: 16px; color: #777; }

        /* 오른쪽 지도 */
        #map { flex: 1; height: 100%; }

        /* 인포윈도우 커스텀 */
        .custom-overlay {
            padding: 10px;
            background: white;
            border: 2px solid var(--point-pink);
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #d63384;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="menu_wrap">
        <div class="bakery-deco">
            <span title="마카롱">🍬</span>
            <span title="휘낭시에">🧁</span>
            <span title="생크림빵">🍰</span>
            <span title="소시지빵">🌭</span>
        </div>
        
        <h1>냠냠 베이커리</h1>
        
        <div class="search_box">
            <form onsubmit="searchPlaces(); return false;">
                <input type="text" value="베이커리" id="keyword" placeholder="빵집을 찾아봐요!">
                <button type="submit">찾기</button>
            </form>
        </div>
        <ul id="placesList"></ul>
    </div>

    <div id="map"></div>
</div>

<script>
    var mapContainer = document.getElementById('map'); 
    var mapOption = { 
        center: new kakao.maps.LatLng(37.556, 126.97), /* 서울 중심부로 초기 위치 변경 */
        level: 7 
    }; 

    var map = new kakao.maps.Map(mapContainer, mapOption); 
    var ps = new kakao.maps.services.Places();  
    var markers = [];

    // [기능 추가 1] 내 현재 위치 표시용 마커 (하트 눈 이모티콘 😍)
    var myCurrentPosition = new kakao.maps.LatLng(37.556, 126.97);
    var currMarker = new kakao.maps.CustomOverlay({
        position: myCurrentPosition,
        content: '<div style="font-size: 26px; background: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border: 2px solid #ff8fa3;">😍</div>'
    });
    currMarker.setMap(map);

    // [기능 추가 2] 서울 주요 빵지순례길 핫플레이스 경로 좌표 설정 (연남 -> 성수 -> 압구정)
    var bakeryRoutePath = [
        new kakao.maps.LatLng(37.561, 126.924), // 연남동 레이어드/랜디스 인근
        new kakao.maps.LatLng(37.544, 127.056), // 성수동 어니언/밀도 인근
        new kakao.maps.LatLng(37.524, 127.036)  // 압구정 노티드/런던베이글 인근
    ];

    // 지도에 순례길 선(Polyline) 그리기
    var bakeryPolyline = new kakao.maps.Polyline({
        path: bakeryRoutePath, // 선을 구성하는 좌표 배열
        strokeWeight: 5,       // 선의 두께
        strokeColor: '#FFA6B9', // 선의 색상 (달콤한 핑크)
        strokeOpacity: 0.8,    // 선의 불투명도
        strokeStyle: 'dash'    // 선의 스타일 (점선으로 순례길 느낌 강조)
    });

    bakeryPolyline.setMap(map);

    function searchPlaces() {
        var keyword = document.getElementById('keyword').value;
        ps.keywordSearch(keyword, function(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            }
        }); 
    }

    function displayPlaces(places) {
        var listEl = document.getElementById('placesList'), 
            bounds = new kakao.maps.LatLngBounds();
        
        listEl.innerHTML = '';
        removeMarker();

        for (var i=0; i<places.length; i++) {
            var placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
            
            // 연핑크색 커스텀 마커 생성
            var marker = new kakao.maps.CustomOverlay({
                position: placePosition,
                content: '<div style="background:#FFC0CB; color:white; padding:5px 10px; border-radius:15px; font-size:12px; border:2px solid white; box-shadow:2px 2px 5px rgba(0,0,0,0.2);">🍞</div>'
            });
            
            marker.setMap(map);
            markers.push(marker);

            var itemEl = document.createElement('li');
            itemEl.innerHTML = '<h5>' + places[i].place_name + '</h5><span>' + (places[i].road_address_name || places[i].address_name) + '</span>';
            
            (function(pos) {
                itemEl.onclick = function() {
                    map.panTo(pos);
                };
            })(placePosition);

            listEl.appendChild(itemEl);
            bounds.extend(placePosition);
        }
        // 검색 결과에 맞춰 지도를 움직이되, 순례길도 함께 볼 수 있도록 구성됨
        map.setBounds(bounds);
    }

    function removeMarker() {
        for (var i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }   
        markers = [];
    }

    // 초기 검색 실행
    searchPlaces();
</script>
</body>
</html>
