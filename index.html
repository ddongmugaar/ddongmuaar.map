<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장소 검색 서비스</title>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c0aff5d8d60d26dbd5c92e48b0aeac3f&libraries=services"></script>
    <style>
        /* 기본 설정 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Malgun Gothic', dotum, sans-serif; }
        body, html { height: 100%; overflow: hidden; }

        /* 전체 레이아웃 (좌: 검색, 우: 지도) */
        .container { display: flex; height: 100vh; width: 100%; }

        /* 왼쪽 검색 영역 */
        #menu_wrap {
            width: 350px;
            height: 100%;
            background: #fff;
            z-index: 10;
            overflow-y: auto;
            border-right: 1px solid #ddd;
            padding: 20px;
        }

        .search_box { margin-bottom: 20px; }
        .search_box input {
            width: 75%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .search_box button {
            width: 20%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        /* 검색 결과 리스트 스타일 */
        #placesList { list-style: none; }
        #placesList li {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        #placesList li:hover { background: #f9f9f9; }
        #placesList li h5 { color: #2d68ff; margin-bottom: 5px; }
        #placesList li span { font-size: 13px; color: #666; }

        /* 오른쪽 지도 영역 */
        #map { flex: 1; height: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div id="menu_wrap">
        <div class="search_box">
            <form onsubmit="searchPlaces(); return false;">
                <input type="text" value="학교 주변 맛집" id="keyword" placeholder="장소를 입력하세요">
                <button type="submit">검색</button>
            </form>
        </div>
        <ul id="placesList"></ul>
    </div>

    <div id="map"></div>
</div>

<script>
    // 1. 지도 초기화
    var mapContainer = document.getElementById('map'); 
    var mapOption = { 
        center: new kakao.maps.LatLng(37.66, 126.83), // 학교 위치 중심
        level: 5 // 확대 레벨
    }; 

    var map = new kakao.maps.Map(mapContainer, mapOption); 

    // 장소 검색 객체를 생성합니다
    var ps = new kakao.maps.services.Places();  

    // 마커를 담을 배열입니다
    var markers = [];

    // 키워드로 장소를 검색합니다
    function searchPlaces() {
        var keyword = document.getElementById('keyword').value;

        if (!keyword.replace(/^\s+|\s+$/g, '')) {
            alert('키워드를 입력해주세요!');
            return false;
        }

        // 장소검색 객체를 통해 키워드로 장소검색을 요청합니다
        ps.keywordSearch(keyword, placesSearchCB); 
    }

    // 장소검색이 완료됐을 때 호출되는 콜백함수입니다
    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            // 정상적으로 검색이 완료됐으면 검색 목록과 마커를 표출합니다
            displayPlaces(data);
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('검색 결과가 존재하지 않습니다.');
        } else if (status === kakao.maps.services.Status.ERROR) {
            alert('검색 결과 중 오류가 발생했습니다.');
        }
    }

    // 검색 결과 목록과 마커를 표출하는 함수입니다
    function displayPlaces(places) {
        var listEl = document.getElementById('placesList'), 
            bounds = new kakao.maps.LatLngBounds();
        
        // 검색 결과 목록 초기화
        listEl.innerHTML = '';
        removeMarker();

        for (var i=0; i<places.length; i++) {
            var placePosition = new kakao.maps.LatLng(places[i].y, places[i].x),
                marker = addMarker(placePosition), 
                itemEl = getListItem(i, places[i]);

            bounds.extend(placePosition);

            // 마커와 목록 항목에 클릭 이벤트를 등록합니다
            (function(marker, title) {
                itemEl.onclick = function() {
                    displayInfowindow(marker, title);
                    map.panTo(marker.getPosition());
                };
            })(marker, places[i].place_name);

            listEl.appendChild(itemEl);
        }
        
        // 검색된 장소 위치를 기준으로 지도 범위를 재설정합니다
        map.setBounds(bounds);
    }

    // 리스트 아이템 생성 함수
    function getListItem(index, places) {
        var el = document.createElement('li');
        var itemStr = '<div>' + '<h5>' + places.place_name + '</h5>';
        if (places.road_address_name) {
            itemStr += '<span>' + places.road_address_name + '</span>';
        } else {
            itemStr += '<span>' + places.address_name + '</span>';
        }
        itemStr += '</div>';
        el.innerHTML = itemStr;
        return el;
    }

    // 마커 생성 함수
    function addMarker(position) {
        var marker = new kakao.maps.Marker({
            position: position
        });
        marker.setMap(map);
        markers.push(marker);
        return marker;
    }

    // 지도 위 마커 제거 함수
    function removeMarker() {
        for (var i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }   
        markers = [];
    }

    // 인포윈도우(정보창) 표시 함수
    var infowindow = new kakao.maps.InfoWindow({zIndex:1});
    function displayInfowindow(marker, title) {
        var content = '<div style="padding:5px;z-index:1;">' + title + '</div>';
        infowindow.setContent(content);
        infowindow.open(map, marker);
    }
</script>
</body>
</html>
