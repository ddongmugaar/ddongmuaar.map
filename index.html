<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>냠냠 베이커리</title>

    <!-- 카카오맵 -->
    <script type="text/javascript"
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c0aff5d8d60d26dbd5c92e48b0aeac3f&libraries=services">
    </script>

    <!-- 학교안심나들이체 -->
    <style>
        @font-face {
            font-family: 'SchoolSafety';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/SchoolSafety.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'SchoolSafety', sans-serif;
        }

        body, html{
            width:100%;
            height:100%;
            overflow:hidden;
            background:#fff8fb;
        }

        .container{
            display:flex;
            width:100%;
            height:100vh;
        }

        /* 왼쪽 메뉴 */
        #menu_wrap{
            width:360px;
            height:100%;
            background:white;
            border-right:3px dashed #ffc8dd;
            padding:18px;
            overflow-y:auto;
            box-shadow:4px 0 10px rgba(0,0,0,0.05);
        }

        /* 작은 빵 일러스트 */
        .mini-bread{
            font-size:18px;
            margin-bottom:8px;
            opacity:0.9;
        }

        .title{
            text-align:center;
            font-size:38px;
            color:#ff72ac;
            margin-bottom:18px;
        }

        /* 검색창 */
        .search_box{
            margin-bottom:20px;
        }

        .search_box form{
            display:flex;
            gap:8px;
        }

        .search_box input{
            flex:1;
            padding:12px;
            border:2px solid #ffc8dd;
            border-radius:15px;
            outline:none;
            font-size:17px;
            background:#fff8fb;
        }

        .search_box button{
            padding:12px 16px;
            border:none;
            border-radius:15px;
            background:#ff9ec4;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.2s;
        }

        .search_box button:hover{
            background:#ff7eb6;
            transform:scale(1.04);
        }

        /* 검색 결과 */
        #placesList{
            list-style:none;
        }

        #placesList li{
            background:#fff8fb;
            border:2px solid #ffd6e7;
            border-radius:18px;
            padding:14px;
            margin-bottom:12px;
            cursor:pointer;
            transition:0.2s;
        }

        #placesList li:hover{
            background:#ffeaf3;
        }

        #placesList li h5{
            color:#ff5fa2;
            font-size:20px;
            margin-bottom:4px;
        }

        #placesList li span{
            font-size:14px;
            color:#666;
        }

        /* 지도 */
        #map{
            flex:1;
            height:100%;
        }

    </style>
</head>

<body>

<div class="container">

    <!-- 왼쪽 -->
    <div id="menu_wrap">

        <!-- 작은 빵 -->
        <div class="mini-bread">
            🍩 🧁 🥐 🥖
        </div>

        <!-- 제목 -->
        <div class="title">
            🍓 냠냠 베이커리 🍞
        </div>

        <!-- 검색창 -->
        <div class="search_box">
            <form onsubmit="searchPlaces(); return false;">
                <input
                    type="text"
                    id="keyword"
                    value="학교 주변 베이커리"
                    placeholder="베이커리를 검색해보세요 🍰"
                />
                <button type="submit">검색</button>
            </form>
        </div>

        <!-- 검색 결과 -->
        <ul id="placesList"></ul>

    </div>

    <!-- 지도 -->
    <div id="map"></div>

</div>

<script>

    // 지도 생성
    var mapContainer = document.getElementById('map');

    var mapOption = {
        center: new kakao.maps.LatLng(37.66, 126.83),
        level: 5
    };

    var map = new kakao.maps.Map(mapContainer, mapOption);

    // 장소 검색 객체
    var ps = new kakao.maps.services.Places();

    // 마커 배열
    var markers = [];

    // 인포윈도우
    var infowindow = new kakao.maps.InfoWindow({
        zIndex:1
    });

    // 현재 위치 표시
    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(function(position){

            var lat = position.coords.latitude;
            var lon = position.coords.longitude;

            var locPosition = new kakao.maps.LatLng(lat, lon);

            // 현재 위치 마커
            var currentOverlay = new kakao.maps.CustomOverlay({
                position: locPosition,
                content:
                `
                <div style="
                    background:#87cefa;
                    color:white;
                    padding:9px 13px;
                    border-radius:20px;
                    font-size:15px;
                    border:2px solid white;
                    box-shadow:0 2px 6px rgba(0,0,0,0.2);
                ">
                    📍 내 위치
                </div>
                `
            });

            currentOverlay.setMap(map);

            map.setCenter(locPosition);

        });
    }

    // 장소 검색
    function searchPlaces(){

        var keyword = document.getElementById('keyword').value;

        if(!keyword.replace(/^\s+|\s+$/g, '')){
            alert('검색어를 입력해주세요 🍞');
            return;
        }

        ps.keywordSearch(keyword, placesSearchCB);
    }

    // 검색 완료
    function placesSearchCB(data, status){

        if(status === kakao.maps.services.Status.OK){

            displayPlaces(data);

        } else if(status === kakao.maps.services.Status.ZERO_RESULT){

            alert('검색 결과가 없어요 🥺');

        } else if(status === kakao.maps.services.Status.ERROR){

            alert('검색 중 오류가 발생했어요!');
        }
    }

    // 검색 결과 표시
    function displayPlaces(places){

        var listEl = document.getElementById('placesList');
        var bounds = new kakao.maps.LatLngBounds();

        listEl.innerHTML = '';

        removeMarker();

        for(var i = 0; i < places.length; i++){

            var placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);

            var marker = addMarker(placePosition);

            var itemEl = getListItem(places[i]);

            bounds.extend(placePosition);

            (function(marker, title){

                itemEl.onclick = function(){

                    displayInfowindow(marker, title);

                    map.panTo(marker.getPosition());
                };

            })(marker, places[i].place_name);

            listEl.appendChild(itemEl);
        }

        map.setBounds(bounds);
    }

    // 리스트 생성
    function getListItem(place){

        var el = document.createElement('li');

        var itemStr =
            '<div>' +
            '<h5>🥐 ' + place.place_name + '</h5>';

        if(place.road_address_name){
            itemStr += '<span>' + place.road_address_name + '</span>';
        } else {
            itemStr += '<span>' + place.address_name + '</span>';
        }

        itemStr += '</div>';

        el.innerHTML = itemStr;

        return el;
    }

    // 연핑크 마커 생성
    function addMarker(position){

        var markerContent =
        `
        <div style="
            width:22px;
            height:22px;
            background:#ffb6d5;
            border:3px solid white;
            border-radius:50%;
            box-shadow:0 2px 6px rgba(0,0,0,0.25);
        "></div>
        `;

        var marker = new kakao.maps.CustomOverlay({
            position: position,
            content: markerContent
        });

        marker.setMap(map);

        markers.push(marker);

        return marker;
    }

    // 마커 제거
    function removeMarker(){

        for(var i = 0; i < markers.length; i++){
            markers[i].setMap(null);
        }

        markers = [];
    }

    // 인포윈도우
    function displayInfowindow(marker, title){

        var content =
        `
        <div style="
            padding:10px 14px;
            font-size:16px;
            color:#ff5fa2;
            background:white;
            border-radius:15px;
            border:2px solid #ffd6e7;
        ">
            🍓 ${title}
        </div>
        `;

        infowindow.setContent(content);

        infowindow.open(map, marker);
    }

    // 첫 검색 자동 실행
    searchPlaces();

</script>

</body>
</html>
