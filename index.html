<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>냠냠 베이커리</title>

    <!-- 카카오맵 -->
    <script type="text/javascript"
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c0aff5d8d60d26dbd5c92e48b0aeac3f&libraries=services">
    </script>

    <!-- 귀여운 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gaegu', cursive;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background: #fff8fb;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100%;
            position: relative;
        }

        /* 왼쪽 메뉴 */
        #menu_wrap {
            width: 360px;
            height: 100%;
            background: #fff;
            z-index: 10;
            overflow-y: auto;
            border-right: 3px dashed #ffc8dd;
            padding: 20px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.05);
        }

        .title {
            text-align: center;
            font-size: 42px;
            color: #ff7eb6;
            margin-bottom: 18px;
            font-weight: 700;
        }

        .search_box {
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
        }

        .search_box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ffc8dd;
            border-radius: 15px;
            outline: none;
            font-size: 18px;
            background: #fff8fb;
        }

        .search_box button {
            padding: 12px 15px;
            background: #ff9ec4;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 17px;
            transition: 0.2s;
        }

        .search_box button:hover {
            background: #ff7eb6;
            transform: scale(1.05);
        }

        /* 검색 결과 */
        #placesList {
            list-style: none;
        }

        #placesList li {
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 18px;
            background: #fff8fb;
            border: 2px solid #ffd6e7;
            cursor: pointer;
            transition: 0.2s;
        }

        #placesList li:hover {
            background: #ffeaf3;
            transform: translateY(-2px);
        }

        #placesList li h5 {
            color: #ff5fa2;
            margin-bottom: 5px;
            font-size: 22px;
        }

        #placesList li span {
            font-size: 15px;
            color: #777;
        }

        /* 지도 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 귀여운 빵 일러스트 */
        .bread {
            position: absolute;
            font-size: 40px;
            z-index: 20;
            user-select: none;
        }

        .bread1 { top: 12px; right: 20px; }
        .bread2 { bottom: 18px; right: 30px; }
        .bread3 { top: 18px; left: 390px; }
        .bread4 { bottom: 20px; left: 380px; }

    </style>
</head>
<body>

<div class="container">

    <!-- 귀여운 빵 -->
    <div class="bread bread1">🍩</div>
    <div class="bread bread2">🧁</div>
    <div class="bread bread3">🥐</div>
    <div class="bread bread4">🥖</div>

    <!-- 검색 영역 -->
    <div id="menu_wrap">

        <div class="title">🍓 냠냠 베이커리 🍞</div>

        <div class="search_box">
            <form onsubmit="searchPlaces(); return false;" style="display:flex; width:100%; gap:8px;">
                <input type="text"
                       value="학교 주변 베이커리"
                       id="keyword"
                       placeholder="베이커리를 검색해보세요 🍰">
                <button type="submit">검색</button>
            </form>
        </div>

        <ul id="placesList"></ul>
    </div>

    <!-- 지도 -->
    <div id="map"></div>
</div>

<script>

    // 지도 초기화
    var mapContainer = document.getElementById('map');

    var mapOption = {
        center: new kakao.maps.LatLng(37.66, 126.83),
        level: 5
    };

    var map = new kakao.maps.Map(mapContainer, mapOption);

    // 장소 검색 객체
    var ps = new kakao.maps.services.Places();

    // 마커 배열
    var markers = [];

    // 현재 위치 마커
    var currentMarker = null;

    // 현재 위치 표시
    if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(function(position) {

            var lat = position.coords.latitude;
            var lon = position.coords.longitude;

            var locPosition = new kakao.maps.LatLng(lat, lon);

            // 현재 위치 마커 (하늘색)
            currentMarker = new kakao.maps.Marker({
                map: map,
                position: locPosition
            });

            // 현재 위치 마커 스타일
            var currentOverlay = new kakao.maps.CustomOverlay({
                position: locPosition,
                content: `
                    <div style="
                        background:#87cefa;
                        color:white;
                        padding:10px 14px;
                        border-radius:20px;
                        font-size:16px;
                        font-weight:bold;
                        box-shadow:0 2px 6px rgba(0,0,0,0.2);
                    ">
                        📍 내 위치
                    </div>
                `
            });

            currentOverlay.setMap(map);

            map.setCenter(locPosition);

        });
    }

    // 검색 함수
    function searchPlaces() {

        var keyword = document.getElementById('keyword').value;

        if (!keyword.replace(/^\s+|\s+$/g, '')) {
            alert('검색어를 입력해주세요 🍞');
            return false;
        }

        ps.keywordSearch(keyword, placesSearchCB);
    }

    // 검색 완료 콜백
    function placesSearchCB(data, status) {

        if (status === kakao.maps.services.Status.OK) {

            displayPlaces(data);

        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {

            alert('검색 결과가 없어요 🥺');

        } else if (status === kakao.maps.services.Status.ERROR) {

            alert('오류가 발생했어요!');
        }
    }

    // 장소 표시
    function displayPlaces(places) {

        var listEl = document.getElementById('placesList');
        var bounds = new kakao.maps.LatLngBounds();

        listEl.innerHTML = '';

        removeMarker();

        for (var i = 0; i < places.length; i++) {

            var placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);

            var marker = addMarker(placePosition);

            var itemEl = getListItem(i, places[i]);

            bounds.extend(placePosition);

            (function(marker, title) {

                itemEl.onclick = function() {

                    displayInfowindow(marker, title);

                    map.panTo(marker.getPosition());
                };

            })(marker, places[i].place_name);

            listEl.appendChild(itemEl);
        }

        map.setBounds(bounds);
    }

    // 리스트 아이템
    function getListItem(index, places) {

        var el = document.createElement('li');

        var itemStr =
            '<div>' +
            '<h5>🥐 ' + places.place_name + '</h5>';

        if (places.road_address_name) {
            itemStr += '<span>' + places.road_address_name + '</span>';
        } else {
            itemStr += '<span>' + places.address_name + '</span>';
        }

        itemStr += '</div>';

        el.innerHTML = itemStr;

        return el;
    }

    // 핑크 마커 생성
    function addMarker(position) {

        var imageSrc =
            'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png';

        var imageSize = new kakao.maps.Size(40, 42);

        var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);

        var marker = new kakao.maps.Marker({
            position: position,
            image: markerImage
        });

        marker.setMap(map);

        markers.push(marker);

        return marker;
    }

    // 마커 제거
    function removeMarker() {

        for (var i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }

        markers = [];
    }

    // 인포윈도우
    var infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

    function displayInfowindow(marker, title) {

        var content =
            '<div style="padding:10px 15px; font-size:18px; color:#ff5fa2;">🍓 ' +
            title +
            '</div>';

        infowindow.setContent(content);

        infowindow.open(map, marker);
    }

    // 첫 검색 자동 실행
    searchPlaces();

</script>

</body>
</html>
