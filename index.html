<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뚝딱! 더위 피하기 지도 🧊</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c0aff5d8d60d26dbd5c92e48b0aeac3f&libraries=services"></script>
    <style>
        :root {
            --point-blue: #4A90E2;  /* 메인 시원한 파란색 */
            --point-mint: #A5D6A7;  /* 보조 싱그러운 민트색 */
            --bg-ice: #F0F8FF;      /* 아리스 블루 배경색 */
        }

        * { font-family: 'Gaegu', cursive; box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: var(--bg-ice); }

        .container { display: flex; height: 100vh; }

        /* 왼쪽 사이드바 */
        #menu_wrap {
            width: 380px;
            height: 100%;
            background: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            border-right: 3px dashed var(--point-blue);
            position: relative;
        }

        /* 더위 대피 아이콘 데코레이션 */
        .ice-deco {
            position: absolute;
            top: 5px;
            left: 5px;
            display: flex;
            gap: 5px;
            z-index: 20;
        }
        .ice-deco span { font-size: 24px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1)); }

        h1 {
            color: var(--point-blue);
            text-align: center;
            font-size: 38px;
            margin-top: 15px;
            margin-bottom: 20px;
            text-shadow: 2px 2px #E6F2FF;
        }

        .search_box { margin-bottom: 20px; position: relative; }
        .search_box input {
            width: 100%;
            padding: 12px 15px;
            border: 3px solid var(--point-blue);
            border-radius: 20px;
            font-size: 20px;
            outline: none;
        }
        .search_box button {
            position: absolute;
            right: 5px;
            top: 5px;
            padding: 8px 15px;
            background: var(--point-blue);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 리스트 스타일 */
        #placesList { list-style: none; padding: 0; overflow-y: auto; flex: 1; }
        #placesList li {
            padding: 15px;
            margin-bottom: 10px;
            background: #F4F9FF;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid transparent;
        }
        #placesList li:hover { 
            transform: scale(1.02); 
            border: 1px solid var(--point-blue);
        }
        #placesList li h5 { color: #1A5276; font-size: 22px; margin: 0 0 5px 0; }
        #placesList li span { font-size: 16px; color: #666; }

        /* 오른쪽 지도 */
        #map { flex: 1; height: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div id="menu_wrap">
        <div class="ice-deco">
            <span title="에어컨">🍃</span>
            <span title="얼음">🧊</span>
            <span title="그늘막">⛱️</span>
            <span title="수박">🍉</span>
        </div>
        
        <h1>더위 피하는 지도</h1>
        
        <div class="search_box">
            <form onsubmit="searchPlaces(); return false;">
                <input type="text" value="무더위 쉼터" id="keyword" placeholder="쉼터나 은행을 검색해보세요!">
                <button type="submit">찾기</button>
            </form>
        </div>
        <ul id="placesList"></ul>
    </div>

    <div id="map"></div>
</div>

<script>
    var mapContainer = document.getElementById('map'); 
    var mapOption = { 
        center: new kakao.maps.LatLng(37.556, 126.97), /* 서울 중심부 */
        level: 6 
    }; 

    var map = new kakao.maps.Map(mapContainer, mapOption); 
    var ps = new kakao.maps.services.Places();  
    var markers = [];

    // [내 위치 표시용 마커] 더워서 지친 땀방울 이모티콘 (🥵)
    var myCurrentPosition = new kakao.maps.LatLng(37.556, 126.97);
    var currMarker = new kakao.maps.CustomOverlay({
        position: myCurrentPosition,
        content: '<div style="font-size: 26px; background: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border: 2px solid #4A90E2;">🥵</div>'
    });
    currMarker.setMap(map);

    function searchPlaces() {
        var keyword = document.getElementById('keyword').value;
        ps.keywordSearch(keyword, function(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            }
        }); 
    }

    function displayPlaces(places) {
        var listEl = document.getElementById('placesList'), 
            bounds = new kakao.maps.LatLngBounds();
        
        listEl.innerHTML = '';
        removeMarker();

        for (var i=0; i<places.length; i++) {
            var placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
            
            // 시원한 하늘색의 쉼터 커스텀 마커 생성 (얼음 아이콘 🧊)
            var marker = new kakao.maps.CustomOverlay({
                position: placePosition,
                content: '<div style="background:#4A90E2; color:white; padding:5px 10px; border-radius:15px; font-size:12px; border:2px solid white; box-shadow:2px 2px 5px rgba(0,0,0,0.2);">🧊</div>'
            });
            
            marker.setMap(map);
            markers.push(marker);

            var itemEl = document.createElement('li');
            itemEl.innerHTML = '<h5>' + places[i].place_name + '</h5><span>' + (places[i].road_address_name || places[i].address_name) + '</span>';
            
            (function(pos) {
                itemEl.onclick = function() {
                    map.panTo(pos);
                };
            })(placePosition);

            listEl.appendChild(itemEl);
            bounds.extend(placePosition);
        }
        map.setBounds(bounds);
    }

    function removeMarker() {
        for (var i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }   
        markers = [];
    }

    // 초기 검색 실행
    searchPlaces();
</script>
</body>
</html>
